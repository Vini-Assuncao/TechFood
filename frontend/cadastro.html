<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/styles/global.css" />
    <link rel="stylesheet" href="src/styles/cadastro.css" />
    <title>Cadastrar Prato - TechFood</title>
  </head>

  <body>
    <header id="topo-loja">
      <h1 id="titulo-site">TechFood - Sabor & Saber</h1>
      <p id="boas-vindas">Cadastro de novos pratos</p>

      <input type="checkbox" id="bt_menu" />
      <label for="bt_menu" id="label-menu">&#9776;</label>

      <nav id="menu">
        <ul>
          <li><a href="index.html">Cardápio</a></li>
          <li><a href="pedidos.html">Meus Pedidos</a></li>
          <li><a href="cadastro.html" class="ativo">Cadastrar Prato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="secao-cadastro">
        <h2 class="titulo-secao">Cadastrar Novo Prato</h2>

        <form id="form-cadastro-prato">
          <div class="grupo-form">
            <label for="nome">Nome do prato</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Ex: Hambúrguer Tech"
              required
            />
          </div>

          <div class="grupo-form">
            <label for="descricao">Descrição</label>
            <textarea
              id="descricao"
              name="descricao"
              rows="4"
              placeholder="Descreva os ingredientes do prato..."
              required
            ></textarea>
          </div>

          <div class="linha-form">
            <div class="grupo-form">
            <label for="categoria">Categoria</label>
            <input
                type="text"
                id="categoria"
                name="categoria"
                placeholder="Ex: Lanche, Pizza, Bebida..."
                maxlength="30"
                required
            />
            </div>

            <div class="grupo-form">
              <label for="preco">Preço (R$)</label>
              <input
                type="number"
                id="preco"
                name="preco"
                step="0.01"
                min="0"
                placeholder="0,00"
                required
              />
            </div>
          </div>

          <div class="grupo-form">
            <label for="imagem">Imagem do prato</label>

            <input
              type="file"
              id="imagem"
              name="imagem"
              accept="image/*"
              required
            />

            <img
              id="preview-imagem"
              src=""
              alt="Pré-visualização"
              style="display:none"
            />
          </div>

          <button type="submit" class="btn-salvar">
            Cadastrar Prato
          </button>
        </form>
      </section>
    </main>

    <footer id="rodape">
      <div class="info-footer">
        <p><strong>TechFood 2026</strong></p>
        <p>Escola SENAI Ítalo Bologna - Itu/SP</p>
        <p>Av. das Nações, 1500</p>
      </div>

      <p id="data-hora-footer"></p>
    </footer>

    <script src="src/scripts/global.js"></script>
    <script src="src/scripts/cadastro.js"></script>
  </body>
</html>
